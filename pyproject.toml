[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "livebridge-generative-recsys"
version = "0.1.0"
description = "Cross-domain short-video-to-live recommendation with generative retrieval and constrained slate-level RL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "gymnasium>=1.0",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=16",
  "torch>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
livebridge = "livebridge_rl.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
